# diarie's OWN structural lint. It travels with `git subtree split --prefix=diarie`; the
# repo-root config does not, and neither did these rules before Wave 2 — the extracted package
# would have shipped green with every one of its guards silently gone, which is precisely the
# failure mode `no-hardcoded-tracker-dir` exists to prevent, applied to the rules themselves.
#
# NOTE THE ABSENCE OF A PATH LIST. `ast-grep scan` with no path arguments walks the whole project
# from this config's directory, so there is no "outer bound" to keep in step with the rules, and no
# way for a rule to end up scoped to a directory the runner forgot to list. The plugin's root runner
# must maintain such a list (it lints a subset of a bigger repo) and it has been bitten: `ast-grep
# scan` on a missing path prints an error and EXITS 0, so a stale entry made the check pass while
# scanning nothing.
#
# ⚠️ THAT DOES NOT MAKE THE BUG UNREPRESENTABLE — an earlier draft of this comment claimed it did,
# and a reviewer disproved it in one line. The bound has MOVED, not vanished: a bare scan is bounded
# by `.gitignore`, so any broad ignore (`lib/generated/`, `dist/`) silently shrinks lint coverage
# with nothing going red. The root runner at least asserts its listed paths exist; this config
# asserts nothing about how many files its scan actually reached. A `scannedFileCount` floor once
# guarded this (vp-beads-flr), but was retired (diarie-agf) as an inconsistent per-tool special case —
# `check:md` (remark, also `.gitignore`-bounded) had the identical exposure with no floor. Detection is
# now deliberate discipline: every line in `.gitignore` is a lint-scope decision.
#
# TWO ruleDirs, and the split is the whole point. `@voxpelli/ast-grep-rules` owns the HOUSE
# conventions (JSDoc/ESM style) — one copy, shared with vp-beads, which cannot drift. `.ast-grep/`
# owns rules that encode DIARIE'S OWN vocabulary and invariants: the store-name pair, the reserved
# exit 2. No shared package can own those, so they stay local on purpose rather than pending
# upstreaming. ast-grep has no `extends`, which is why this is two directories rather than one
# config inheriting another.
ruleDirs:
  - node_modules/@voxpelli/ast-grep-rules/rules
  - .ast-grep/rules
testConfigs:
  - testDir: .ast-grep/rule-tests
