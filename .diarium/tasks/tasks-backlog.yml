  - id: diarie-doc
    title: 'If a `doctor` is ever added it must check the ENVIRONMENT, not the data — and the scope is small'
    status: pending
    type: task
    priority: low
    labels:
      - decision
    acceptance_criteria:
      - "RESEARCHED 2026-08-05 across primary sources: `doctor` conventionally diagnoses THE TOOL'S OWN ENVIRONMENT, not the user's data — `brew doctor` (system), `npm doctor` (registry reachability, node/npm versions, cache checksums, directory permissions), `flutter doctor` (SDK/toolchain/IDE/devices; Dart SOURCE analysis is a separate verb, `flutter analyze`), `pnpm doctor`, `bundle doctor`. The apt precedent for a DATA-integrity check is `fsck` — and note `git fsck` inspects the object database and is deliberately not called doctor"
      - "so a `doctor` that lints `.diarium/` YAML would be a SECOND NAME FOR `validate`. Reject that framing outright; it is the one-authority anti-pattern wearing a friendly name"
      - "the only defensible content is store-DISCOVERY health, which genuinely is not validate's job: both forms of the pair present (ETWOSTORES), a legacy `.diarie/` present, an ANCESTOR store shadowing the one you expected, an unwritable store, the Node version against `engines`. Note every one of these is currently only reachable by TRIPPING it during real work — a doctor would let you ask proactively"
      - "counter-argument to weigh before building it: diarie deliberately has almost no environment. No daemon, no cache, no auth, no plugin matrix, and by decision diarie-pos the store's location on disk IS the entire configuration. The list above may simply be too short to earn a subcommand — `diarie where` (deferred in diarie-spa) may be the honest size of it"
      - "if it is built, decide the exit code deliberately: the convention is INCONSISTENT (`brew doctor` exits 1, `pnpm doctor` non-zero, but `flutter doctor` returns a warning status and NEVER fails — a long-standing CI complaint). A doctor that only reports sits badly with a project whose thesis is that nothing important is whispered"
    description: >-
      Filed 2026-08-05 after the user raised `doctor` as a possible deeper mode beyond `validate`. Both
      a code-architect pass and an independent prior-art survey reached the same conclusion from
      different directions, so the row exists to STOP the idea being re-raised in its data-linting
      form — and to preserve the one form that would be legitimate.
    updated: '2026-08-05'
  - id: diarie-nar
    title: 'A flag to narrow `validate` to a subset of entity types — decide FILTER-WHAT-IS-READ vs FILTER-WHAT-IS-REPORTED first'
    status: pending
    type: task
    priority: low
    labels:
      - decision
    acceptance_criteria:
      - "THE HAZARD, and it is this project's founding defect wearing a flag: a narrowed run must never be indistinguishable from a full one. `validate --only decision` that prints `Store validation passed` is a tracker reporting a clean store it did not read. Whatever ships must state the narrowing in BOTH channels — the text line and the `--json` payload — not merely leave `fileCount` lower and hope someone notices"
      - "THE DESIGN TENSION THAT DECIDES THE SHAPE: one type filter is TWO different operations depending on which side of the store it falls. Across the record homes it is an IO filter — `RECORD_DIRS` maps type to directory, so `--only task` can skip reading `decisions/` and `docs/` outright. Inside `tasks/` it is a findings filter — `milestone` rows share `tasks-<slug>.yml` with `task` rows, so no type filter can skip a single file there. The consequence is what matters: the same flag would skip files in one region and merely mute findings in the other, so 'what did this run actually READ' has two answers at once. Decide whether the flag means read-less or report-less, and say which in the output"
      - "if it is a findings filter, the honest motivation is FOCUS, not speed — validate reads 17 files in this repo in milliseconds, so nobody is waiting. Say that plainly when deciding, because 'it will be faster' is the reason that will be assumed and it is not true"
      - "`check:tasks` must never pass it. The gate's whole value is that it asks the widest question; a narrowing flag reachable from the gate script is how the gate quietly stops covering things (precedent: `check:test` being removable is exactly this failure, recorded in CLAUDE.md)"
      - "vocabulary comes from `VALID_TYPES` in schema.js, never a bespoke list — and the flag must reject an unknown value with EUSAGE rather than silently matching nothing, which would be a narrowed run reporting clean for a typo"
      - "sequencing: this rides on the structured `Diagnostic[]` payload (each finding already carrying its type) — filtering prose strings by type would mean re-deriving the type from a message, which is the parse-the-output anti-pattern the payload exists to delete"
    description: >-
      Raised 2026-08-05 by the user, immediately after `validate` was widened to read the whole store
      (tasks, records, and stray entries). The widening is what creates the appetite: now that one
      command covers four entity types, narrowing it becomes a sensible thing to want. Filed rather
      than built because the narrowing direction is a real fork — see the second criterion — and
      because a partial-coverage flag on the integrity gate is precisely the shape this tool exists
      to refuse, so it earns a decision rather than an implementation.
    updated: '2026-08-05'
