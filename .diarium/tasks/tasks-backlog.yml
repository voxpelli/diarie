  - id: diarie-unk
    title: '`diarie validate` should catch unknown/mistyped task keys (allowlist) — decide error-vs-warning + the --strict question'
    status: pending
    type: task
    priority: medium
    labels:
      - feature
    acceptance_criteria:
      - "Add a canonical KNOWN_FIELDS set to lib/schema.js — REQUIRED_FIELDS plus every optional field (priority/type/deps/parent/labels/acceptance_criteria/agent/updated/description). schema.js:36-38 ALREADY reserves this allowlist and its `description` exemption; derive from the one authority so add-a-field and allow-a-field are one edit and cannot drift"
      - "validate.js: flag any task key not in KNOWN_FIELDS, naming the key + row — a mistyped `descrption`/`titel`/`updted` is silent data loss today (the loader drops it, validate never checks). This is the unknown-key half of the open question already sitting in diarie-rdr's AC and schema.js:36-38"
      - "DECIDE error-vs-warning deliberately (do NOT default it): task fields are a CLOSED schema (unlike open-vocabulary `labels` VALUES, diarie-lbl), so an unknown key is unambiguously wrong — which argues for an ERROR (exit 2 via ResultError), caught by `check:tasks` (bare `node cli.js validate`) by default"
      - "IF warning instead: `check:tasks` runs bare `validate` with NO flags, and warnings do NOT affect its exit — `validate` carries only json+root; --strict is a `ready` flag, NOT validate (verified 2026-07-20). Warning-only would exit 0 and WHISPER the typo, the exact drop-without-report the founding thesis forbids — so it REQUIRES also adding --strict to validate (mirroring ready's verdict-on-the-result) AND running `validate --strict` in check:tasks"
      - "SCOPE: task rows in tasks-*.yml only. Decision/doc FRONTMATTER is out of scope — validate does not load those files yet (diarie-dlm / diarie-xid own that); an unknown-key check there rides on decision-frontmatter loading landing first"
      - "Coordinate with diarie-fil/diarie-lnk: when `files`/`links` land they join KNOWN_FIELDS in schema.js — one authority, so the unknown-key check learns the new fields for free"
      - "Tests: a fixture with a typo'd key is caught (mutation-verified able to go red), a clean store passes, and whichever severity is chosen is asserted on the exit code (error → exit 2 bare; warning → exit 0 bare + exit 2 under --strict)"
    description: >-
      Requested 2026-07-20 out of the decision-status review (decision diarie-dsv). Task rows have a
      CLOSED field schema, but validate checks only REQUIRED_FIELDS presence + enum values on the
      KNOWN keys — a misspelled key sails through and is then silently dropped by the loader, the exact
      silent-data-loss class this tracker exists to abolish. schema.js:36-38 already reserves the
      allowlist (with the `description` exemption) for precisely this check. Distinct from diarie-rdr
      (loader drops a KNOWN field of the wrong TYPE) and diarie-lbl (open-vocabulary label VALUES); this
      is unknown KEYS against a closed schema. The user framed it as "a --strict mode or such" — but
      --strict today is a `ready` flag, not a `validate` one, so the row must first decide
      error-vs-warning (the closed schema argues error) and, only if warning, add --strict to validate
      rather than assume it exists.
    updated: '2026-07-20'
