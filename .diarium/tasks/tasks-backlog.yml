  - id: diarie-frm
    title: 'Storage FORM is coupled to entity TYPE, and the stated reason is measurably false — decide whether to decouple them'
    status: pending
    type: task
    priority: high
    labels:
      - decision
    acceptance_criteria:
      - "THE MEASUREMENT THAT PROMPTED THIS (2026-08-05, this repo's own store): 72 rows, 57 of them carrying >1000 characters of prose in `description` + `acceptance_criteria`, 25 carrying >2000, and ZERO carrying under 100. The 16 decision records' bodies run 2161/5527/13195 (min/median/max). The largest ROW (diarie-snd, 10773 chars) out-proses 14 of the 16 RECORDS. schema.js justifies the split as `the body is the prose the terse row can't hold` — the rows are not terse and the distributions overlap almost completely, so TYPE does not predict prose volume, which is the only stated reason two forms exist"
      - "REPLICATED on a SECOND, independent store (vp-beads `.diarie/`, 2026-08-05): 110 rows, prose min/median/max 311/1493/25963, 84 over 1000 chars, NONE under 100; its 5 records' bodies run 3682/4452/5377. The largest ROW there carries 4.8× the prose of the largest RECORD body. So across 182 rows in two stores the claim is not merely unsupported, it is INVERTED — rows hold more prose than bodies do. Known limit, stated rather than hidden: both stores share one author, and no third-party store exists to check, so this is not evidence about diarie's users in general"
      - "SECOND MEASUREMENT, both stores: every one of the 182 rows is `type: task`. Zero milestones exist ANYWHERE, and `docs/` is created by nothing (see diarie-typ). So the four-type/two-form mapping has exactly TWO live arms — task→YAML row, decision→markdown file — and the other two are asserted, never exercised"
      - "THE COUPLING IS NOT SYMMETRICALLY ENFORCED, and as of 2026-08-05 that asymmetry is SHARPER than it was. Measured: a `type: decision` row inside `tasks-<slug>.yml` is accepted silently — validate says nothing, ready correctly excludes it — so decision-as-row already WORKS and is unflagged (diarie-typ owns flagging it, and whether it SHOULD be flagged depends on this decision). Meanwhile a `type: task` record is now an explicit ERROR, from the directory↔type check added in c1c832d. One direction is convention, the other is enforced, and the enforcement was added by the commit that widened validate — noted so it is not mistaken for a long-standing rule"
      - "THE REFRAME the user proposed and the evidence supports: the rule is drawn on the wrong axis. `does this entity carry prose` is an INSTANCE property; `what kind of thing is this` is a TYPE property. Coupling them means a 10k-character task cannot become a file and a one-line decision cannot become a row, for no reason either the schema or the data can defend"
      - "WHAT MAKES THIS NEWLY CHEAP: as of 2026-08-05 the field schema is already ONE implementation across both forms (`lintFields` in lib/validate.js validates a task row and a record's frontmatter identically). The entity model is therefore ALREADY unified; what remains coupled is only which directory the bytes sit in and which serialization they use"
      - "THE STRONGEST COUNTER, and it must not be waved through: today a decision in force is STRUCTURALLY incapable of being offered as workable, because the loader globs `tasks-*.yml` and records are not in it — schema.js and README both state this as a guarantee, and bd got it wrong precisely here. Decoupling downgrades that from `cannot happen` to `there is a type check`. That check already exists in ready.js:171 for the SUBJECT — and the dep loop forty lines below it lacks the same check (see the non-task-deps work), which is live evidence that the runtime check is easy to forget and the structural property is doing real work"
      - "SECOND COUNTER: a flat `tasks-<slug>.yml` is reviewable as ONE unit in a PR diff and greppable as one file — arguably diarie's best property, and the reason `collapse everything to one-file-per-entity` is not obviously the clean answer. 70 markdown files is not a thing you read top to bottom"
      - "THIRD COUNTER, the one most likely to bite: if form is per-instance, users need a way to PROMOTE a row to a file and demote it back. That is a CRUD operation, and VISION.md refuses a CRUD layer on the grounds that it would make diarie the owner of your data. Either the promotion is a hand-edit (plausible — delete a YAML entry, write a file) and stays honest, or the demand for `diarie promote` becomes the thin end of exactly the wedge the vision declines. Decide this BEFORE the model, because it may be what settles it"
      - "OPTIONS TO WEIGH EXPLICITLY, not just the first two: (a) decouple — any type in either form, loader reads both; (b) collapse to files — one entity per markdown file, no YAML rows at all; (c) collapse to rows — prose moves into YAML block scalars, no record files at all (note this repo already writes 6-line `description: >-` blocks, so it is less absurd than it sounds); (d) keep the coupling but fix its JUSTIFICATION in schema.js to say what is actually true, which is that batching suits terse entities and files suit prose ones — a defensible rule stated on the right axis, still enforced by type as a proxy"
      - "SEQUENCING: this pressures diarie-rel (can a record satisfy a dep) and diarie-ids (a record has no slug, so what is its GlobalId — decoupling forces that answer), and it subsumes part of diarie-typ (`doc` being vestigial). Do not answer those separately first; whichever option wins here decides them"
    description: >-
      Raised 2026-08-05 by the user immediately after `validate` was widened to read the whole store:
      "why do we have to rule which to choose for what, can't we support both for everything and get
      a cleaner entity model?". Filed as a DECISION rather than work because every option here is a
      one-way door on the store format, and because the measurement above turns it from a taste
      question into a factual one — the current split is justified by a claim about prose volume that
      this repo's own data contradicts. Note the honest possibility that the answer is (d): keep the
      behaviour, fix the reasoning. A rule can be right while its stated reason is wrong.
    updated: '2026-08-05'
  - id: diarie-fsp
    title: 'SPIKE: cost out letting the loader read RECORDS — the one number diarie-frm lacks'
    status: pending
    type: task
    priority: high
    labels:
      - spike
    acceptance_criteria:
      - "PURPOSE: diarie-frm asks whether storage form should stop being decided by entity type. Three of its four options are cheap to reason about; option (a) `any type in either form` is the one nobody can price, and a one-way store-format decision should not be taken on a guess. This spike produces a NUMBER and a verdict, not an implementation — close it with findings, per the `spike` label's semantics"
      - "MEASURED ALREADY, so start from here rather than rediscovering it: the directory↔type check is ONE line in `lintRecords` (lib/validate.js) plus one test. That is the enforcement point, and it is trivially removable. The real cost is elsewhere — `lib/store/load-tasks.js` globs `tasks-*.yml` and has no notion of a record at all, so `computeReady` cannot see one no matter what its type says"
      - "cost the four things that actually change: (1) the loader reading two serializations; (2) a record's GlobalId — rows namespace as `slug/id` via nsId and a record HAS no slug, so decoupling forces the id model (diarie-xid / diarie-ids own it); (3) dep resolution across forms (diarie-rel); (4) the ready-walk's per-row work — records are whole files, so N records means N reads where N rows means one"
      - "state plainly what is LOST, because it is the strongest counter and a spike that ignores it is advocacy: today a decision cannot be offered as work because the loader structurally cannot see it. Under option (a) that becomes a type check — and ready.js's dep loop demonstrably lacks the equivalent check today, so `we will remember to check` has already failed once in this file"
      - "do NOT prototype into main. A throwaway branch or a scratch store is enough to produce the estimate; the point is to inform a decision, and an implementation would prejudge it"
    description: >-
      Filed 2026-08-05 alongside diarie-frm. It exists so the decision is not taken on vibes: the
      measurement that motivates diarie-frm is about PROSE, and the thing that makes decoupling
      expensive is the LOADER, which no measurement has touched. Ready now and deliberately not
      blocked on diarie-frm — it is an input to that decision, not an output of it.
    updated: '2026-08-05'
  - id: diarie-fmg
    title: 'Realize whatever diarie-frm decides — a one-way store migration that must refuse rather than lose'
    status: pending
    type: task
    priority: high
    deps:
      - diarie-frm
    labels:
      - feature
    acceptance_criteria:
      - "BLOCKED BY DESIGN on diarie-frm, so this row exists to make sure the implementation is not lost once the decision lands — it becomes ready automatically the moment diarie-frm completes. Three of the four options move data on disk: (b) collapse-to-files turns 72 rows into 72 files, (c) collapse-to-rows folds 16 record bodies into YAML, (a) decouple moves nothing immediately but changes what every reader must handle. Only option (d) — keep the behaviour, fix the justification — is a comment change"
      - "🚨 THE HAZARD THAT DECIDES THE MECHANISM, already measured (2026-08-05, recorded under the validate --fix work): a whole-document js-yaml round-trip on this repo's store goes 1816 → 2956 lines (+63%) and 15 comment lines → 1, with 2544 lines changed. The deleted header includes the sentence explaining why there is no CRUD command. So any option that REWRITES tasks-<slug>.yml programmatically destroys the file's comments on its first run. Surgical byte-splicing or hand-editing only; `yaml.dump` over the store is not available as a tool here"
      - "hold it to the standard `migrate` is held to: refuse rather than lose data it cannot map, leave NO TRACE on failure (project everything before the first write), report on stdout with a non-zero exit, and never claim success for a partial move. This is the same class of operation and must not be softer for being internal"
      - "whatever ships, `validate` must be able to read the store BEFORE and AFTER — including the mixed state if the move is incremental. A migration that leaves the gate unable to parse its own store reproduces the founding defect at the worst possible moment"
      - "the docs that state the current model must move in the same change, not after: `lib/schema.js`'s type-model header (which currently carries a ⚠️ marking its justification contested), README's `decision and doc carry prose` paragraph, and CLAUDE.md's store bullet. Grep before drafting, not after — feature-rename commits routinely triple in scope on the doc surfaces"
    description: >-
      Filed 2026-08-05 as the downstream half of diarie-frm. Deliberately carries `deps` rather than
      sitting as a note inside the decision row: a dep is the mechanism this tool exists to provide,
      it puts the work in `ready --blocked` today, and it promotes the row automatically instead of
      relying on someone re-reading the decision later. If diarie-frm settles on option (d), close
      this row as cancelled with that reason recorded.
    updated: '2026-08-05'
