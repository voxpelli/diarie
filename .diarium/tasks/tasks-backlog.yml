      broken row unmarked (A3). The pinned array has nowhere to carry a marker. Our own consumer (the
      hook) will check the code; a third party might not. That is the cost of not breaking the shape.


      THE HOOK HALF is vp-beads-hkt (extend it, do not duplicate). Its trap, MEASURED: `$(cmd || echo
      "[]")` does NOT overwrite on failure — it captures stdout and APPENDS the fallback, producing a
