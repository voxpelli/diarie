  - id: diarie-snd
    title: '`--strict` fuses a real defect with a normal state, which is why refusing cannot be the DEFAULT — split it'
    status: pending
    type: task
    priority: high
    labels:
      - decision
    acceptance_criteria:
      - "THE FRAMING, from the user 2026-08-05: refusing on an untrustworthy answer should arguably be the DEFAULT, with a flag to RELAX it — not an opt-in. The founding law is that anything a caller must not miss shows up in the exit code, and `ENOSTORE` is already an error by default rather than something you opt into. `--strict` today inverts that for a store that is PARTLY unreadable"
      - "🛑 BUT DO NOT INVERT THE DEFAULT. Adversarial review 2026-08-05, and I verified both decisive claims myself rather than taking them: (1) `test/cli.spec.js:1082` is a NAMED test — '`--strict` stays OPT-IN — a broken store without it still exits 0' — so the current default is a deliberate, pinned decision, not an oversight; changing it is an ASK-FIRST test rewrite. (2) A REAL consumer breaks, and breaks into this project's own founding defect: `vp-beads/hooks/session-start.sh:265` runs `$tracker_cmd --json --root \"$PWD\" 2>/dev/null || echo \"\"` and `:273` runs `if ! claims_json=$(... --filter in_progress --json ...)`. Both guards fire on ANY non-zero exit, and `:274`'s own comment states the assumption — `InputError (ENOSTORE/EUSAGE): stdout holds an error OBJECT, not an array. Discard it.` But exit 2 is ResultError, where stdout holds a VALID array. Under strict-by-default a healthy mid-sprint store (everything claimed -> `ambiguous`) exits 2, the guard discards a CORRECT answer, and the session-start hook silently reports no claims — exactly when a sprint is busiest"
      - "so the fusion is the bug and the DEFAULT IS NOT. Fixing the fusion is what this row is for; flipping the default while the fusion stands would make the cry-wolf worse, because the falsely-alarming half (`ambiguous`) would then gate the common case instead of the opt-in one"
      - "also breaks if the default flips, enumerated so a future attempt does not rediscover them: ~a dozen assertions in test/cli.spec.js:951-1212; README's whole exit-code table (its `0 = the answer is on stdout` row becomes conditionally false); `brand/index.html:681-711`, which NO gate can check for a false claim; CLAUDE.md's own exit-code section; and vp-beads' CLAUDE.md, which documents bare `diarie ready` as the canonical sprint-start command"
      - "REPRODUCED 2026-08-05, and it is the founding defect in the default path: a store with `title: 42` answers plain `diarie ready` with the row printed and NO title, exit 0, and the complaint on STDERR — the stream ten call sites pipe to /dev/null. The answer is partly fictional and the exit code says success"
      - "THE REASON IT CANNOT SIMPLY BECOME DEFAULT, also reproduced: `unsound` ALSO fires on `ambiguous` (ready.length === 0 && blocked.length > 0), which is a PERFECTLY NORMAL store where everything open is claimed. Strict-by-default would exit 2 on a healthy backlog. One boolean, one real defect and one normal state — so the flag has to be opt-in to avoid crying wolf, which leaves the defect half quiet by default. THE FUSION IS THE BUG"
      - "so SPLIT BY WHETHER THE ANSWER IS WRONG, not by how it was caused: (a) the loader REJECTED something, so the answer is missing data it should have had — a defect, and the candidate for default-loud; (b) `needsAttention` — the row IS in the output, in its own partition, so it is already reported and arguably needs no exit code; (c) `ambiguous` — see the trap below before filing this one as merely `stays opt-in`"
      - "🚨 THE TRAP, and it is why a naive split is WRONG: `ambiguous` is NOT simply `a normal state`. The comment above it (lib/commands/ready.js ~180-189) records that the predicate was DELIBERATELY WIDENED because the narrow version `made --strict exit 0 on a parent cycle: the one thing its own flag description promises to catch`. So `ready.length === 0 && blocked.length > 0` is a CYCLE DETECTOR IMPLEMENTED AS A SIDE EFFECT — it fires only once the cycle has starved the whole queue, which is exactly why diarie-cyc reproduces. File `ambiguous` as `normal, stays opt-in` and the cycle coverage leaves with it, silently. diarie-cyc and this row are ONE bug seen from two ends and must be designed together"
      - "consider therefore whether `ready` should stop proxying cycles AT ALL and let `validate` own them (it finds cycles properly, by Kahn, rather than by starvation) — and if so, what `ready` still owes a caller who never runs `validate`"
      - "NOTE the flag description was rewritten 2026-08-05 to name all its causes, ending `...or nothing is ready while work remains`. That clause is accurate about the MECHANISM but calls a healthy store untrustworthy — it documents this defect rather than fixing it, and must be revisited when this row resolves. Do not treat the description as settled"
      - "then decide the default for (a) alone, and what the relaxing flag is called (`--lenient`? `--no-strict`?). Note `--strict` would keep meaning `refuse on all three`, so it does not have to be removed"
      - "do NOT add a second exit code — 2 is reserved for ResultError and NOTHING ELSE MAY USE 2 (lib/utils/exit.js). This row must not become a vocabulary change"
      - "changing the default is BREAKING for real: plain `diarie ready` would go 0 -> 2 on stores that work today. Announce it, and check whether `stats` (which has no exit-code channel at all) should get the same treatment in the same release"
    description: >-
      Filed 2026-08-05 while fixing the flag's own description, which named only two of the four
      causes it actually fires on. Companion to diarie-unk, which already records that `--strict` is
      a `ready` flag and not a `validate` one, and to diarie-cyc.

      The question is not where the verdict lives but whether ONE boolean can honestly carry it. A
      consumer that gets exit 2 cannot tell "a field was rejected" from "everything is claimed", and
      those want opposite responses: go fix your YAML, versus go finish something. The causes are
      already computed separately and already ride in the `--json` payload — this is about the
      exit-code channel, i.e. the caller who pipes nothing, which is the caller the founding thesis
      is written for.
      - "THE DESIGN, from a code-architect pass 2026-08-05. THREE TIERS, split by whether the ANSWER IS WRONG rather than by mechanism. Tier A CORRUPTED (candidate for default-loud): `warnings.length > 0`, plus a NEW real `cyclic` signal. Tier B NOTABLE (stays opt-in behind `--strict`): `needsAttention`, `blocked[].attention`, and `allClaimed`. Tier none: plain `blocked` on a live dep"
      - "THE STRUCTURAL MOVE THAT MAKES IT WORK, and it is the point rather than a nicety: STOP PROXYING CYCLES. Extract `buildBlockingGraph` + `findCycles` out of lib/validate.js (private today, ~:267-292 and ~:358-428) into a shared `lib/graph.js`, and have `ready` detect cycles FOR REAL over the same graph. Then `allClaimed` becomes `ready.length === 0 && blocked.length > 0 && !cyclic`, which can only mean `every open chain terminates in claimed work` — benign, so diarie-cyc dies and repro #2 stops being a false alarm. Precedent for one-graph-one-place is nsId (schema.js ~:362-377): `Two implementations of one id rule is what let one of them be incomplete`"
      - "`--strict` KEEPS ITS NAME and shrinks: it stops meaning `refuse on everything` and means `also refuse on Tier B`. Proposed semantics: exit 2 iff `(corrupted && !relaxFlag) || (strict && (notable || allClaimed))`. The two compose. Relax-flag name is the least settled part — `--lossy` pairs with `migrate --lossy` in house vocabulary but reads oddly for `the graph is cyclic`, where nothing is literally lost; `--best-effort` is the alternative"
      - "⚖️ THE UNRESOLVED TENSION, stated so nobody thinks it is settled: the architect's Tier A is still a DEFAULT FLIP, which the adversarial pass argued against. The split DOES neutralise the adversary's headline case — a healthy mid-sprint store is `allClaimed`, which lands in Tier B and still exits 0, so vp-beads' session-start hook is untouched by it. What survives is narrower: a store with genuine loader warnings would newly exit 2, and that hook's `|| echo \"\"` would still discard a correct answer. Decide THAT, not the general question"
      - "REJECTED: a `doctor` subcommand. `brew`/`npm`/`flutter doctor` check the ENVIRONMENT the tool runs in; `validate` checks the user's DATA. diarie has almost no environment — no daemon, no cache, no auth, no plugin matrix, and by decision diarie-pos the store's location on disk IS the entire configuration. So `doctor` would either duplicate `validate` under a second name or bolt on checks that belong in `lintTasks` as a fifth pass"
      - "PRIOR ART, researched 2026-08-05 against primary sources and binaries rather than recall, and it converges with the tier design above. THE DECISION RULE the evidence supports: tools refuse by default when proceeding yields a SILENTLY WRONG OR IRREVERSIBLE result, and stay lenient when the output is advisory and a human can judge. Every mature tool uses a PER-CHECK SEVERITY DIAL, not one switch — rustc `allow/warn/deny/forbid`, `git fsck.<msg-id>=error|warn|ignore`, `kubectl --validate=strict|warn|ignore`. That is the same shape as the three tiers above, arrived at independently"
      - "DIRECTION OF TRAVEL: TypeScript flipped `strict: true` to the DEFAULT in 6.0/7.0 (verified empirically — 5.9 exits 0 where 7.0.2 rejects, and `--strict false` is now a genuine RELAXING flag). Its stated rationale is nearly our founding thesis verbatim: lenient defaults are `a pit-of-failure experience that we want users to avoid`. Same arc: npm 7 made peer conflicts a hard error where v6 only warned; PEP 668; kubectl field validation went default-strict in 1.27. NO mainstream tool was found moving strict -> lenient"
      - "🔧 PREMISE CORRECTED: `git fsck --strict` is NOT the lenient-default precedent it was taken for. Git's ORDINARY READERS refuse hard — `git show`/`status`/`log --stat` exit 128 when they need a corrupt object; `--strict` only adds a pedantic legacy check. Git is a STRICT-BY-DEFAULT data point and the closest analogue to diarie. Also: `terraform validate` has no strict/relax axis and does not document its exit codes, so it is precedent for nothing"
      - "A LINE WORTH COPYING, from `npm ls`: it exits 1 on MISSING/INVALID but 0 on EXTRANEOUS-only. `the tree is wrong` refuses; `there is extra stuff` does not. Pairs with Allman's caveat that liberality is what allows EXTENSION — so tolerate keys we do not recognise (see diarie-ext) but refuse a known key with the wrong type. `title: 42` is not extension"
      - "TIMING IS THE STRONGEST PRACTICAL ARGUMENT FOR DOING IT NOW: we are at 0.2.2, pre-1.0. Every tool in the survey paid dearly for tightening AFTER mass adoption. The counter-cost is real too — `ready` is the interactive command you run all day, so one bad row would block every invocation; TS carved out loose/inferred files for exactly that. Mitigation: the relaxing flag must be named IN THE REFUSAL MESSAGE, not merely in --help"
    updated: '2026-08-05'
