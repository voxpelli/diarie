id: no-hardcoded-tracker-dir
snapshots:
  ? |
    const p = `${root}/diarium/tasks/tasks-x.yml`
  : labels:
    - source: '`${root}/diarium/tasks/tasks-x.yml`'
      style: primary
      start: 10
      end: 45
  ? |
    const tasksDir = join(root, '.diarie', 'tasks')
  : labels:
    - source: '''.diarie'''
      style: primary
      start: 28
      end: 37
  ? |
    const tasksDir = join(root, '.diarium', 'tasks')
  : labels:
    - source: '''.diarium'''
      style: primary
      start: 28
      end: 38
  ? |
    const tasksDir = join(root, 'backlog/tasks')
  : labels:
    - source: '''backlog/tasks'''
      style: primary
      start: 28
      end: 43
  ? |
    const tasksDir = join(root, 'diarium', 'tasks')
  : labels:
    - source: '''diarium'''
      style: primary
      start: 28
      end: 37
  ? |
    stderr.write('refusing to write under .diarium/tasks/\n')
  : labels:
    - source: '''refusing to write under .diarium/tasks/\n'''
      style: primary
      start: 13
      end: 56
